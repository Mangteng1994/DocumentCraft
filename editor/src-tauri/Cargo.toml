[package]
name = "documentcraft-editor"
version = "0.2.9"
description = "DocumentCraft 阅读编辑器"
edition = "2021"
rust-version = "1.89"

[lib]
name = "documentcraft_editor_lib"
# 仅桌面端：cdylib 只用于 Tauri 移动端，且在 windows-gnullvm 目标上会超出 65535 个导出符号的链接限制。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
