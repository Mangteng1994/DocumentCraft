[package]
name = "documentcraft-editor"
version = "0.3.0"
description = "DocumentCraft 阅读编辑器"
edition = "2021"
rust-version = "1.89"

[lib]
name = "documentcraft_editor_lib"
# 仅桌面端：cdylib 只用于 Tauri 移动端，且在 windows-gnullvm 目标上会超出 65535 个导出符号的链接限制。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
# 删除文件时移入回收站（可还原），不直接永久删除（DC-064）。
trash = "5"
# 文本编码识别：中文环境里大量 txt、csv、日志是 GBK 编码，识别后才能搜索与预览（DC-058）。做法参考 pivotsearch。
chardetng = "1"
encoding_rs = "0.8"

# 自动更新插件只用于桌面端，签名校验、下载与 NSIS 安装由插件完成（DC-063）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
